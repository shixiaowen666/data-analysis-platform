server:
  port: 9099  # 应用服务器端口号

spring:
  application:
    name: chat-server
  cloud:
    nacos:
      discovery:
        server-addr: ip:port
        timeout: 30000  # 连接超时时间，30秒
        heart-beat-timeout: 30000  # 心跳超时时间
        heart-beat-interval: 10000  # 心跳间隔
        ip: ${spring.cloud.client.ip-address}  # 使用本机IP
        fail-fast: false  # 启动时若连接不上Nacos，仍然启动应用
    feign:
      httpclient:
        okhttp:
          enabled: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://ip:port/new_bi?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: chatbi
    password: FlXvMdkofiMFZTAKFu4L
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  #### Redis 配置 ###########
  data:
    redis:
      database: 0
      host: ip
      port: port
      password: chatbi@Redis#2026
      timeout: 50000
      lettuce:
        pool:
          max-active: 100
          max-wait: 1000
          max-idle: 40
          min-idle: 20

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 60000
        logger-level: basic
      data-server:
        connect-timeout: 5000
        read-timeout: 120000
        logger-level: basic
  #  metrics-indicatrix: http://127.0.0.1:8091
  data-server: http://127.0.0.1:8088
  #任务拆解模块配置
  resolver: http://127.0.0.1:5000

  compression:
    request:
      enabled: false
    response:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

###minio配置
minio:
  endpoint: http://ip:port
  accessKey: admin
  secretKey: minio123456
  chatdata:
    bucketName: chatdata
  ide:
    bucketName: test

# 分页配置
chatbi:
  paging:
    default-page: 1
    default-page-size: 20
    download-page-size: 1000
    ai-page-size: 5000
    preview-page-size: 10

# JWT认证配置
jwt:
  accesstoken: Accesstoken
  header: Authorization  # JWT认证请求头名称
  secret: chatbi-jwt-secret-key-for-production-2026  # JWT签名密钥 (≥32字符)
  # token 过期时间 1天
  expiration: 86400000  # 令牌过期时间，单位为毫秒，即1天
