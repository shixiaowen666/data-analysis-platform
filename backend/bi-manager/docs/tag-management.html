<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标签管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #333; }

  .page { max-width: 800px; margin: 40px auto; padding: 0 20px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .header h2 { font-size: 20px; font-weight: 600; }

  .search-bar { display: flex; gap: 12px; margin-bottom: 20px; }
  .search-bar input { flex: 1; height: 36px; padding: 0 12px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 14px; outline: none; }
  .search-bar input:focus { border-color: #409eff; }

  .btn { height: 36px; padding: 0 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: #409eff; color: #fff; }
  .btn-primary:hover { background: #337ecc; }
  .btn-danger { background: #f56c6c; color: #fff; }
  .btn-danger:hover { background: #e04040; }
  .btn-text { background: transparent; color: #409eff; padding: 0 8px; }
  .btn-text:hover { color: #337ecc; }
  .btn-text.danger { color: #f56c6c; }
  .btn-text.danger:hover { color: #e04040; }

  .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card-body { padding: 24px; }
  .empty { text-align: center; padding: 60px 0; color: #999; font-size: 14px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 16px; font-size: 14px; }
  th { background: #fafafa; color: #666; font-weight: 500; border-bottom: 1px solid #ebeef5; }
  td { border-bottom: 1px solid #ebeef5; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f5f7fa; }
  .actions { display: flex; gap: 4px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #fff; border-radius: 8px; width: 420px; max-width: 90vw; box-shadow: 0 4px 20px rgba(0,0,0,.12); }
  .modal-header { padding: 16px 24px; border-bottom: 1px solid #ebeef5; font-size: 16px; font-weight: 600; }
  .modal-body { padding: 24px; }
  .modal-footer { padding: 12px 24px; border-top: 1px solid #ebeef5; display: flex; justify-content: flex-end; gap: 12px; }
  .form-item { margin-bottom: 16px; }
  .form-item label { display: block; font-size: 14px; color: #606266; margin-bottom: 6px; }
  .form-item .required::after { content: ' *'; color: #f56c6c; }
  .form-item input { width: 100%; height: 36px; padding: 0 12px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 14px; outline: none; }
  .form-item input:focus { border-color: #409eff; }
  .form-item .error { color: #f56c6c; font-size: 12px; margin-top: 4px; }

  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); padding: 10px 24px; border-radius: 6px; font-size: 14px; color: #fff; z-index: 200; animation: fadeIn .3s ease; }
  .toast-success { background: #67c23a; }
  .toast-error { background: #f56c6c; }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
<body>

<div class="page">

  <div class="header">
    <h2>标签管理</h2>
    <button class="btn btn-primary" onclick="openCreate()">+ 新建标签</button>
  </div>

  <div class="search-bar">
    <input type="text" id="keyword" placeholder="搜索标签名称..." oninput="loadList()">
  </div>

  <div class="card">
    <div class="card-body">
      <table>
        <thead>
          <tr>
            <th style="width:80px">ID</th>
            <th>标签名称</th>
            <th style="width:180px">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
      <div class="empty" id="empty" style="display:none">暂无标签数据</div>
    </div>
  </div>

</div>

<!-- 新建/编辑弹窗 -->
<div class="modal-overlay" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-header" id="modalTitle">新建标签</div>
    <div class="modal-body">
      <div class="form-item">
        <label class="required">标签名称</label>
        <input type="text" id="tagName" maxlength="100" placeholder="请输入标签名称">
        <div class="error" id="nameError" style="display:none">请输入标签名称</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" style="background:#f0f2f5;color:#606266" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submit()">保存</button>
    </div>
  </div>
</div>

<script>
// ==== 模拟接口 ====
// TODO: 替换为实际 API 调用
const API = '/api/v1/recommend/tag';

let editId = null;

async function loadList() {
  const keyword = document.getElementById('keyword').value;
  // 实际调用: const res = await fetch(`${API}/list?keyword=${encodeURIComponent(keyword)}`).then(r => r.json());
  // 以下为模拟数据
  const res = mockList(keyword);

  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('empty');
  if (res.data.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    tbody.innerHTML = res.data.map(tag => `
      <tr>
        <td>${tag.id}</td>
        <td>${tag.name}</td>
        <td class="actions">
          <button class="btn btn-text" onclick="openEdit(${tag.id}, '${escapeHtml(tag.name)}')">编辑</button>
          <button class="btn btn-text danger" onclick="del(${tag.id}, '${escapeHtml(tag.name)}')">删除</button>
        </td>
      </tr>
    `).join('');
  }
}

function openCreate() {
  editId = null;
  document.getElementById('modalTitle').textContent = '新建标签';
  document.getElementById('tagName').value = '';
  hideError();
  showModal();
}

function openEdit(id, name) {
  editId = id;
  document.getElementById('modalTitle').textContent = '编辑标签';
  document.getElementById('tagName').value = name;
  hideError();
  showModal();
}

function showModal() { document.getElementById('modal').style.display = ''; }
function closeModal() { document.getElementById('modal').style.display = 'none'; }

function hideError() {
  document.getElementById('nameError').style.display = 'none';
}

async function submit() {
  const name = document.getElementById('tagName').value.trim();
  if (!name) {
    document.getElementById('nameError').style.display = '';
    return;
  }

  // 实际调用:
  // const res = await fetch(`${API}/save`, {
  //   method: 'POST',
  //   headers: { 'Content-Type': 'application/json' },
  //   body: JSON.stringify({ id: editId, name })
  // }).then(r => r.json());
  // if (res.code === 200) { toast('保存成功', 'success'); closeModal(); loadList(); }
  // else { toast(res.message || '保存失败', 'error'); }

  // 模拟
  toast(editId ? '编辑成功' : '新建成功', 'success');
  closeModal();
  loadList();
}

async function del(id, name) {
  if (!confirm(`确定删除标签「${name}」吗？`)) return;

  // 实际调用:
  // const res = await fetch(`${API}/del/${id}`).then(r => r.json());
  // if (res.code === 200) { toast('删除成功', 'success'); loadList(); }
  // else { toast(res.message || '删除失败', 'error'); }

  // 模拟引用检查
  if (id === 1) { toast('标签已被问题引用，无法删除', 'error'); return; }
  toast('删除成功', 'success');
  loadList();
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function escapeHtml(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

// ==== 模拟数据（实际接入后删除） ====
function mockList(keyword) {
  const all = [
    { id: 1, name: '同比环比' },
    { id: 2, name: '异常诊断' },
    { id: 3, name: '明细下钻' },
    { id: 4, name: '趋势预测' },
    { id: 5, name: '归因分析' }
  ];
  const filtered = keyword ? all.filter(t => t.name.includes(keyword)) : all;
  return { code: 200, data: filtered };
}

loadList();
</script>
</body>
</html>
