upstream olapwebend {
 server 8.145.36.163:8590;
}
upstream dtoauthend {
    server 8.145.36.163:8590;

}
upstream indwebend {
     server 8.145.36.163:8586;
}
upstream sqlwebend {
     server 8.145.36.163:8590;
}
server {
        listen       80;
        server_name  _;

        location / {
            root   /usr/share/nginx/html/;
            index  index.html index.htm;
        }
        location ~ /bloodshow {
                root        /usr/share/nginx/html/html/blood/;
                expires     7d;
            }
        location /uploadimage/ {
                alias /data/www/upload/;
        }


                location /metrics {
                    default_type application/json;
                    return 200 '{"ip":"http://122.115.41.144:15279"}';
                }
        location /webapp {
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_pass http://8.145.36.158:5000;
        }
        location /api/login/ {
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_pass http://dtoauthend/api/login/;
         }
        location /lingxi/api/ {
                proxy_read_timeout 5400s;
                proxy_send_timeout 5400s;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_pass http://olapwebend/api/;
        }
       location /lingxi/api/websocket/ {
                        if ($arg_host) {
                            set $backend $arg_host:8081;
                            proxy_pass http://$backend;

                        }
                        proxy_pass http://8.145.36.163:8590;
                        # 这样会自动把 /lingxi/api/websocket/xxx 作为 path 传给后端
                        # 如果后端只监听 /api/websocket/xxx，需要用 rewrite
                        rewrite ^/lingxi/api/websocket/(.*)$ /api/websocket/$1 break;
                        proxy_http_version 1.1;
                        proxy_set_header Host $host;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection "upgrade";
                        proxy_set_header X-Client-IP $remote_addr;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_connect_timeout 60;
                        proxy_read_timeout 600;
                }

        location /lingxi/api/oauth/ {
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_pass http://olapwebend/api/oauth/;
        }
        location /lingxi/api/indi/ {
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_pass http://indwebend/api/indi/;
        }
        location /lingxi/api/pc/sqlplat/ {
                client_max_body_size   1024m;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_pass http://sqlwebend/api/pc/sqlplat/;
        }
        location = /lingxi/api/dtoauth/res/getSystemResByUrl {
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_pass http://dtoauthend/api/dtoauth/res/getSystemResByUrl;
        }
        location = /lingxi/api/ccs/getCcsInfo {
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_pass http://dtoauthend/api/ccs/getCcsInfo;
        }
        location = /lingxi/get/getQuerySteps{
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_pass http://192.168.10.109:8888/get/getQuerySteps;
        }
        location /upc {
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_pass http://8.145.36.163:8584;
        }
        location /dcar {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://8.145.36.163:8581/dcar;
        }
        location /indicatrix {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://8.145.36.163:8581/indicatrix;
        }
        location /ide/log {
           proxy_pass http://8.145.36.163:8583/ide/log;
           proxy_set_header Host $host:$server_port;
           proxy_http_version 1.1;
           proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection "upgrade";
        }
        location /ide/ {
           proxy_pass http://8.145.36.163:8583/ide/;
           proxy_read_timeout 5400s;
           proxy_send_timeout 5400s;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /linxi/api/olappro/olapdata/getdataForAnalysis {
          proxy_read_timeout 5400s;
          proxy_send_timeout 5400s;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header REMOTE-HOST $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_pass http://olapwebend/api/olappro/olapdata/getdataForAnalysis;
        }
        location /dap {
           proxy_pass http://8.145.36.163:8585;
        }

        location /dam {
           proxy_pass http://8.145.36.163:8582;
        }
        location /growing-gbi {
           proxy_pass http://192.168.10.40:7860;
           proxy_read_timeout 5400s;
           proxy_send_timeout 5400s;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       }
        location /senses-chat {
           proxy_pass  http://8.145.36.163:8589/senses-chat;
        }
        location /chat {
                   proxy_pass  http://8.145.36.163:8080/generate_adhoc_sql;
        }
        location /warning {
            proxy_pass http://8.145.36.163:8080;
            proxy_read_timeout 5400s;
            proxy_send_timeout 5400s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /analysis {
           proxy_pass http://8.145.36.163:8591;
        }
        location /approve {
           proxy_pass http://8.145.36.163:8588;
        }
  }

