<script>
// nginx 前缀代理支持：从当前路径推导 BASE（直连 5000 时为空串，走 /web_json_html 代理时为 /web_json_html）
const BASE = location.pathname.replace(/\/test_[a-z_]+(\.html)?$/i, '');
document.querySelectorAll('a.nav-link[href="/test_all"]').forEach(a => {
  // 嵌在测试中心 iframe 里时隐藏返回链接，避免 iframe 内再嵌一层测试中心导致顶部重复
  if (window.self !== window.top) { a.remove(); } else { a.href = BASE + '/test_all'; }
});

// 手动改过的地址存 localStorage，刷新后保留；未存过则用当前站点源
const baseUrlEl = document.getElementById('baseUrl');
baseUrlEl.value = (() => { try { return localStorage.getItem('baseUrl_v1') || location.origin; } catch (e) { return location.origin; } })();
baseUrlEl.addEventListener('change', () => { try { localStorage.setItem('baseUrl_v1', baseUrlEl.value.trim()); } catch (e) {} });

const JWT_SECRET = 'chatbi-jwt-secret-key-for-production-2026';

function b64url(bytes) {
  let s = '';
  new Uint8Array(bytes).forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');
}

// 纯 JS 版 HMAC-SHA256：非安全上下文（HTTP+IP 访问）下 crypto.subtle 为 undefined，用它兜底
function sha256Bytes(bytes) {
  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const len = bytes.length;
  const padded = new Uint8Array((((len + 8) >> 6) + 1) * 64);
  padded.set(bytes);
  padded[len] = 0x80;
  const dv = new DataView(padded.buffer);
  const bitLen = len * 8;
  dv.setUint32(padded.length - 8, Math.floor(bitLen / 4294967296));
  dv.setUint32(padded.length - 4, bitLen >>> 0);
  const w = new Int32Array(64);
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < padded.length; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i-15], 7) ^ rr(w[i-15], 18) ^ (w[i-15] >>> 3);
      const s1 = rr(w[i-2], 17) ^ rr(w[i-2], 19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) | 0;
      h=g; g=f; f=e; e=(d + t1)|0; d=c; c=b; b=a; a=(t1 + t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  const out = new Uint8Array(32);
  const odv = new DataView(out.buffer);
  for (let i = 0; i < 8; i++) odv.setUint32(i * 4, H[i] >>> 0);
  return out;
}

function hmacSha256(keyBytes, msgBytes) {
  const block = new Uint8Array(64);
  block.set(keyBytes.length > 64 ? sha256Bytes(keyBytes) : keyBytes);
  const inner = new Uint8Array(64 + msgBytes.length);
  for (let i = 0; i < 64; i++) inner[i] = block[i] ^ 0x36;
  inner.set(msgBytes, 64);
  const outer = new Uint8Array(96);
  for (let i = 0; i < 64; i++) outer[i] = block[i] ^ 0x5c;
  outer.set(sha256Bytes(inner), 64);
  return sha256Bytes(outer);
}

async function makeToken() {
  const header = b64url(new TextEncoder().encode(JSON.stringify({alg:'HS256', typ:'JWT'})));
  const payload = b64url(new TextEncoder().encode(JSON.stringify({
    user_id: 'page-test', sub: 'page-test', exp: Math.floor(Date.now()/1000) + 3600,
  })));
  const keyBytes = new TextEncoder().encode(JWT_SECRET);
  const data = new TextEncoder().encode(header + '.' + payload);
  let sig;
  if (window.crypto && crypto.subtle && crypto.subtle.importKey) {
    const key = await crypto.subtle.importKey('raw', keyBytes, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
    sig = new Uint8Array(await crypto.subtle.sign('HMAC', key, data));
  } else {
    sig = hmacSha256(keyBytes, data);
  }
  return `${header}.${payload}.${b64url(sig)}`;
}

function setQuery(el) { document.getElementById('query').value = el.textContent; }

async function checkHealth() {
  const el = document.getElementById('healthStatus');
  try {
    const r = await fetch(`${API()}/health`);
    const j = await r.json();
    el.innerHTML = `<span class="st-ok">OK</span> ${j.status}`;
  } catch (e) {
    el.innerHTML = `<span class="st-fail">DOWN</span> ${e.message}`;
  }
}

const API = () => document.getElementById('baseUrl').value.trim().replace(/\/+$/, '') + BASE;

// database_meta：从 docs/raw_meta.json 加载
let databaseMeta = null;

// 统一 toast：color 传颜色则文字着色（替代原 batchToast 的透明底样式）
function showToast(msg, color = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.cssText = `display:block;padding:8px 16px;border:1px solid #ffccc7;border-radius:4px;font-size:13px;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,0.15);position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff2f0;color:${color || '#333'};`;
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// 复制指定区域内容到剪贴板（执行进度/模型原始输出的「复制」按钮）
async function copyArea(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const text = el.innerText;
  if (!text.trim() || text.trim() === '等待事件...') { showToast('暂无内容可复制'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showToast('已复制到剪贴板', '#52c41a');
  } catch (e) {
    // 降级：非 HTTPS 等非安全上下文下 clipboard API 不可用
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
    showToast(ok ? '已复制到剪贴板' : '复制失败，请手动选择文本', ok ? '#52c41a' : '');
  }
}

// 把存档的协议事件还原成执行进度画面：事件类型着色，token 按 step_id 合并成流式行
function replayProgressHtml(events) {
  if (!events.length) return '';
  const rows = [];
  const tokenIdx = {}; // step_id -> rows 下标，token 流式追加到同一行
  events.forEach(ev => {
    const t = new Date((ev.timestamp || 0) * 1000).toTimeString().slice(0, 8);
    const msg = String(ev.message ?? '').replace(/\n$/, '');
    const sid = ev.step_id || '';
    const et = ev.event_type;
    let line, color;
    if (et === 'token') {
      if (tokenIdx[sid] === undefined) {
        tokenIdx[sid] = rows.length;
        rows.push({ text: '', color: '#722ed1' });
      }
      rows[tokenIdx[sid]].text += msg;
      return;
    } else if (et === 'title') {
      color = '#1677ff'; line = `▶ [${sid || 'close'}] ${msg}`;
    } else if (et === 'line') {
      color = '#555'; line = `  ${msg}`;
    } else if (et === 'done') {
      color = '#52c41a'; line = `✔ [${sid || 'close'}] ${sid ? '完成' : '请求结束'}`;
    } else if (et === 'error') {
      color = '#ff4d4f'; line = `✖ [${sid}] ${msg}`;
    } else {
      color = '#999'; line = JSON.stringify(ev);
    }
    rows.push({ text: `${t} ${line}`, color });
  });
  return rows.map(r => `<div style="white-space:pre-wrap;word-break:break-all;font-size:11px;color:${r.color};">${esc(r.text)}</div>`).join('');
}

// 模型原始输出：按 attempt 分组，JSON 可解析则美化
function replayModelHtml(outputs) {
  if (!outputs || !outputs.length) return '';
  let html = '';
  outputs.forEach(o => {
    const failed = o.status === 'failed';
    let pretty = o.raw_output || '(空)';
    try { pretty = JSON.stringify(JSON.parse(o.raw_output), null, 2); } catch (e) {}
    html += `<div style="border:1px solid #e8e8e8;border-left:3px solid ${failed ? '#ff4d4f' : '#52c41a'};border-radius:4px;padding:6px 10px;margin:6px 0;">
      <div style="font-size:12px;color:${failed ? '#ff4d4f' : '#52c41a'};">第 ${o.attempt ?? '?'} 次尝试 ${failed ? '❌ 失败' : '✅ 成功'}${failed && o.error ? ` · ${esc(o.error)}` : ''}</div>
      <div style="font-size:11px;white-space:pre-wrap;word-break:break-all;color:#333;margin-top:4px;">${esc(pretty)}</div>
    </div>`;
  });
  return html;
}

function singleHistoryView(i) {
  const it = singleHistoryItems[i];
  if (!it) return;
  const events = it.progress_events || [];
  const outputs = it.model_outputs || [];
  const log = it.execution_log || [];
  const out = document.getElementById('output');
  const timingEl = document.getElementById('timing');
  if (timingEl) {
    timingEl.innerHTML = `历史回放 · ${esc(it.ts || '')} · ${it.status === 'ok' ? '<span style="color:#52c41a;">✅ 成功</span>' : '<span style="color:#ff4d4f;">❌ 失败</span>'} · 耗时 ${it.ms ? (it.ms / 1000).toFixed(1) + 's' : '-'}${it.request_id ? ` · ${esc(it.request_id)}` : ''}`;
  }
  let html = '';
  if (!events.length && !outputs.length && !log.length) {
    const errShort = it.error && it.error.length > 200 ? it.error.slice(0, 200) + '…' : (it.error || '');
    html += `<div class="card">
      <h2>📦 历史记录（旧版本存档，无进度/输出明细）</h2>
      <div class="result" style="max-height:300px;overflow:auto;">
        <div style="font-size:12px;color:#999;margin-bottom:6px;">${esc(it.ts || '')} · 耗时 ${it.ms ? (it.ms / 1000).toFixed(1) + 's' : '-'}${it.request_id ? ` · ${esc(it.request_id)}` : ''}</div>
        ${it.answer ? `<div style="font-size:13px;color:#333;margin-top:4px;">💬 ${esc(String(it.answer))}</div>` : ''}
        ${it.error ? `<div style="font-size:12px;color:#cf1322;margin-top:6px;">⚠️ ${esc(errShort)}</div>` : ''}
        ${!it.answer && !it.error ? '<div style="font-size:12px;color:#999;">（该记录无更多详情）</div>' : ''}
      </div>
    </div>`;
    out.innerHTML = html;
    out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }
  if (events.length) {
    html += `<div class="card">
      <h2 style="display:flex;justify-content:space-between;align-items:center;"><span>⏳ 执行进度 <span style="font-weight:normal;font-size:11px;color:#999;">(历史回放 · ${events.length} 条事件)</span></span><button class="btn btn-default" style="padding:2px 12px;font-size:12px;flex-shrink:0;margin-left:12px;" onclick="copyArea('progressArea')">复制</button></h2>
      <div id="progressArea" class="result" style="max-height:300px;">${replayProgressHtml(events)}</div>
    </div>`;
  }
  if (outputs.length) {
    html += `<div class="card">
      <h2 style="display:flex;justify-content:space-between;align-items:center;"><span>🧠 模型原始输出 <span style="font-weight:normal;font-size:11px;color:#999;">(历史回放 · ${outputs.length} 次尝试)</span></span><button class="btn btn-default" style="padding:2px 12px;font-size:12px;flex-shrink:0;margin-left:12px;" onclick="copyArea('modelArea')">复制</button></h2>
      <div id="modelArea" class="result" style="max-height:400px;">${replayModelHtml(outputs)}</div>
    </div>`;
  }
  if (log.length) {
    html += `<div class="card">
      <h2>📋 执行步骤 <span style="font-weight:normal;font-size:11px;color:#999;">(${log.length})</span></h2>
      <div class="steps">`;
    log.forEach(s => {
      const st = (s.status === 'completed' || s.status === 'success') ? 'done' : (s.status === 'failed' ? 'failed' : '');
      html += `<div class="step ${st}">
        <b>${esc(s.step_id || '')}</b> <span style="color:#1677ff;">[${esc(s.type || s.step_type || '')}]</span> ${esc(s.status || '')}
        <div>${esc(s.description || s.desc || '')}</div>
        <div class="meta">${esc(s.error || '')}${s.elapsed !== undefined ? ` elapsed=${s.elapsed}s` : ''}</div>
      </div>`;
    });
    html += '</div></div>';
  }
  html += `<div class="result" id="finalArea">${it.answer ? esc(String(it.answer)) : '<span style="color:#999;">（该记录无最终回答内容）</span>'}</div>`;
  out.innerHTML = html;
  out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function doSingleHistoryDelete(i) {
  const it = singleHistoryItems[i];
  if (!it) return;
  const payload = it.id ? { id: it.id } : { ts: it.ts, query: it.query, status: it.status, ms: it.ms };
  document.getElementById('batchLogModal').innerHTML = '';
  try {
    const token = await makeToken();
    const resp = await fetch(`${API()}/api/v1/single/history`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (data.code === 200 || data.code === 0) {
      singleHistoryLoad();
      const el = document.getElementById('timing');
      if (el) el.innerHTML = '<span style="color:#52c41a;">✅ 已删除 1 条历史记录</span>';
    } else {
      openBatchModal('删除失败', data.message || '删除失败，请重试');
    }
  } catch (e) {
    openBatchModal('删除失败', String(e));
  }
}

function idSource() {
  const el = document.querySelector('input[name="idSource"]:checked');
  return el ? el.value : 'prod';
}
function isProdIdChecked() { return idSource() === 'prod'; }

// 取最新生产 request_id（sessionId@chatId）及收到时间；缓存为空时 data 为 null
async function fetchLatestProdId() {
  const token = await makeToken();
  const r = await fetch(`${API()}/api/v1/latest-request-id`, {
    headers: { 'Authorization': `Bearer ${token}` },
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  const prodId = j.data && j.data.request_id;
  if (!prodId) throw new Error('暂无生产 request_id');
  return { id: prodId, updatedAt: (j.data && j.data.updated_at) || '' };
}

// 平台会话模式：拉取平台上智能体列表（带 aicode），缓存供下拉框使用
let prodAgentsCache = null;
async function fetchProdAgents(force) {
  if (prodAgentsCache && !force) return prodAgentsCache;
  const token = await makeToken();
  const r = await fetch(`${API()}/api/v1/prod-agents`, {
    headers: { 'Authorization': `Bearer ${token}` },
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || `HTTP ${r.status}`);
  const list = (j.data && j.data.agents) || [];
  if (!list.length) throw new Error('平台智能体列表为空');
  prodAgentsCache = list;
  return list;
}

async function loadProdAgentSelect(force) {
  const sel = document.getElementById('prodAgentSelect');
  try {
    const agents = await fetchProdAgents(force);
    sel.innerHTML = agents.map(a => `<option value="${esc(a.code)}">${esc(a.name || a.code)}</option>`).join('');
    sel.style.display = '';
  } catch (e) {
    sel.innerHTML = '';
    sel.style.display = 'none';
    renderProdIdStatus(false, '', '', `智能体列表加载失败: ${e.message}`);

}

// 平台会话自造 request_id：用当前选中智能体 + 查询词创建真实平台会话（会触发平台真实 AI 分析）
async function createPlatformSession(question) {
  const agentCode = document.getElementById('prodAgentSelect').value;
  if (!agentCode) throw new Error('请先选择平台智能体');
  const token = await makeToken();
  const r = await fetch(`${API()}/api/v1/prod-session`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ agent_code: agentCode, question }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || `HTTP ${r.status}`);
  if (!(j.data && j.data.request_id)) throw new Error('平台会话响应缺少 request_id');
  return j.data.request_id;
}

// 已知的生产 id 与收到时间，轮询比对用于提示"收到新的数据"
let knownProdId = '';
let knownProdUpdatedAt = '';

function renderProdIdStatus(ok, id, updatedAt, note) {
  const statusEl = document.getElementById('prodReqIdStatus');
  if (!ok) { statusEl.innerHTML = `<span class="st-fail">暂不可用</span> ${esc(note || '')}`; return; }
  let html = `<span class="st-ok">可用</span> ${esc(id)}`;

  if (note) html += ` · ${esc(note)}`;

}

// 三选一切换：生产模式立即查可用性；平台模式加载智能体下拉；本页生成无需后端
function onIdSourceChange() {
  const mode = idSource();
  document.getElementById('prodAgentSelect').style.display = mode === 'platform' ? '' : 'none';
  document.getElementById('prodReqIdStatus').textContent = '';
  if (mode === 'prod') refreshProdIdStatus();
  if (mode === 'platform') loadProdAgentSelect();
}

// 手动刷新与轮询共用；isPolling 时比对变化弹"收到新的数据"并自动重载元数据
async function refreshProdIdStatus(isPolling) {
  try {
    const { id, updatedAt } = await fetchLatestProdId();
    if (isPolling && knownProdId && (id !== knownProdId || updatedAt !== knownProdUpdatedAt)) {
      showToast(`收到新的生产请求数据：${id}`, '#52c41a');
      loadDbMeta();
    }
    knownProdId = id; knownProdUpdatedAt = updatedAt;
    renderProdIdStatus(true, id, updatedAt);
  } catch (e) {
    if (!isPolling) renderProdIdStatus(false, '', '', e.message);
  }
}

setInterval(() => {

}, 5000);

// 单次与批量共用的 request_id 决策：
// 生产种子 → 取最新生产 id；本页生成 → 前端生成独立测试 id；平台会话 → 创建真实平台会话自造 id
async function resolveTestRequestId(query) {
  const mode = idSource();
  if (mode === 'local') {
    return { requestId: (crypto.randomUUID ? crypto.randomUUID() : `page-${Date.now()}-${Math.random().toString(36).slice(2)}`), prod: false };
  }
  if (mode === 'platform') {
    const id = await createPlatformSession(query);
    renderProdIdStatus(true, id, '', '平台会话已创建（自造）');
    return { requestId: id, prod: true };
  }
  const { id: prodId, updatedAt } = await fetchLatestProdId();
  knownProdId = prodId; knownProdUpdatedAt = updatedAt;
  renderProdIdStatus(true, prodId, updatedAt, '使用中');
  return { requestId: prodId, prod: true };
}

// ==================== 恢复进行中的分析 ====================
// 分析结果与历史记录只由前端在收到 POST 响应后上报，分析中刷新/切走页面即丢失。
// 这里把"进行中"记入 localStorage，页面重新打开后自动重连 SSE（重放补齐画面）
// 并轮询后端结果缓存（/api/v1/analyze-result/<id>）恢复现场。
const RECOVERY_KEY = 'pendingAnalyzeRecovery_v1';
const RECOVERY_TTL = 10 * 60 * 1000; // 与后端内存缓冲区 TTL 一致

const PROGRESS_SKELETON = `
    <div class="card">
      <h2 style="display:flex;justify-content:space-between;align-items:center;"><span>⏳ 执行进度 <span style="font-weight:normal;font-size:11px;color:#999;">(Redis Stream 协议消息)</span></span><button class="btn btn-default" style="padding:2px 12px;font-size:12px;flex-shrink:0;margin-left:12px;" onclick="copyArea('progressArea')">复制</button></h2>
      <div id="progressArea" class="result" style="max-height:300px;">等待事件...</div>
    </div>
    <div class="card">
      <h2 style="display:flex;justify-content:space-between;align-items:center;"><span>🧠 模型原始输出 <span style="font-weight:normal;font-size:11px;color:#999;">(拆解 LLM 流式输出，非协议消息)</span></span><button class="btn btn-default" style="padding:2px 12px;font-size:12px;flex-shrink:0;margin-left:12px;" onclick="copyArea('modelArea')">复制</button></h2>
      <div id="modelArea" class="result" style="max-height:400px;">等待事件...</div>
    </div>
    <div class="result" id="finalArea"><span class="streaming">📡 正在分析...</span><div style="font-size:11px;color:#999;">等待响应...</div></div>`;

// 订阅 SSE 进度流；fresh=true 只收订阅后的新事件，否则重放历史事件补齐画面
function openProgressSse(token, requestId, signal, fresh) {
  const qs = fresh ? '?fresh=1' : '';
  return (async () => {
    const r = await fetch(`${API()}/api/v1/progress/${requestId}${qs}`, {
      headers: { 'Authorization': `Bearer ${token}` },
      signal,
    });
    if (!r.ok || !r.body) throw new Error(`SSE 连接失败：${r.status}`);
    const reader = r.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let sseBuf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      sseBuf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = sseBuf.indexOf('\n\n')) >= 0) {
        const raw = sseBuf.slice(0, idx);
        sseBuf = sseBuf.slice(idx + 2);
        const line = raw.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        try { handleProgress(JSON.parse(line.slice(6))); } catch (e) {}
      }
    }
  })().catch(e => {
    if (e.name !== 'AbortError') console.warn('SSE:', e.message);
  });
}

function pendingRecovery() {
  try {
    const raw = localStorage.getItem(RECOVERY_KEY);
    if (!raw) return null;
    const rec = JSON.parse(raw);
    if (!rec || !rec.requestId) return null;
    if (Date.now() - (rec.startedAt || 0) > RECOVERY_TTL) {
      localStorage.removeItem(RECOVERY_KEY);
      return null;
    }
    return rec;
  } catch (e) { return null; }
}

// 页面重新打开时若存在进行中的分析，自动恢复现场
async function tryRecoverPendingAnalysis() {
  const rec = pendingRecovery();
  if (!rec) return;
  const out = document.getElementById('output');
  const timingEl = document.getElementById('timing');
  const queryEl = document.getElementById('query');
  if (!out || !timingEl || !queryEl) return;
  queryEl.value = rec.query || '';

  setAnalyzeRunning(true);
  modelGroups = {};
  tokenRows = {};
  protoEventArchive = [];
  out.innerHTML = PROGRESS_SKELETON;
  timingEl.textContent = '正在恢复分析现场...';
  const requestId = rec.requestId;
  const t0 = Date.now();
  const timer = setInterval(() => { timingEl.textContent = `恢复中 · 已耗时 ${((Date.now()-t0)/1000).toFixed(1)}s`; }, 100);

  const abort = new AbortController();
  window.analyzeAbort = abort; // 取消按钮仍可中止恢复
  window.sseCloseAbortDisabled = true; // close 事件只代表事件流结束，不打断结果轮询

  try {
    const token = await makeToken();
    const ssePromise = openProgressSse(token, requestId, abort.signal, false);
    ssePromise.then(() => { window.sseCloseAbortDisabled = false; });

    // 轮询后端缓存的结果（事件流结束后结果先于 close 事件落入缓存）
    const deadline = Date.now() + RECOVERY_TTL;
    while (Date.now() < deadline) {
      if (abort.signal.aborted) break;
      try {
        const rr = await fetch(`${API()}/api/v1/analyze-result/${requestId}`, {
          headers: { 'Authorization': `Bearer ${token}` },
          signal: abort.signal,
        });
        if (rr.ok) {
          const jr = await rr.json();
          if (jr && jr.found && jr.result) {
            const parsed = jr.result;
            clearInterval(timer);
            window.sseCloseAbortDisabled = false;
            abort.abort();
            renderFinal(parsed);
            timingEl.textContent = `已恢复 · 总耗时 ${((Date.now()-t0)/1000).toFixed(1)}s`;
            setAnalyzeRunning(false);
            try { localStorage.removeItem(RECOVERY_KEY); } catch (e) {}
            singleHistoryReport(rec.query, parsed.status === 'success' ? 'ok' : 'err', Date.now() - t0,
              parsed.status === 'success' ? '' : (parsed.answer || ''), parsed.log_path,
              { requestId, parsed });
            showToast('已恢复上次的分析结果', '#52c41a');
            return;
          }
        }
      } catch (e) {
        if (e.name === 'AbortError') break;
        // 网络抖动等：继续轮询
      }
      await new Promise(res => setTimeout(res, 1500));
    }
    // 超时或主动取消：结果缓存已失效（如服务重启），无法恢复
    clearInterval(timer);
    window.sseCloseAbortDisabled = false;
    abort.abort();
    setAnalyzeRunning(false);
    try { localStorage.removeItem(RECOVERY_KEY); } catch (e) {}
    const el = document.getElementById('finalArea');
    if (el) el.innerHTML = abort.signal.aborted
      ? '<div style="color:#999;">已取消恢复</div>'
      : '<div style="color:#ff4d4f;">分析结果已过期或服务已重启，无法恢复现场，可在下方历史记录中查看</div>';
  } catch (e) {
    clearInterval(timer);
    window.sseCloseAbortDisabled = false;
    abort.abort();
    setAnalyzeRunning(false);
    try { localStorage.removeItem(RECOVERY_KEY); } catch (e2) {}
    renderError(`恢复失败：${e.message}`);
  }
}

// ==================== 单次分析取消 ====================
function cancelAnalyze() {
  if (window.analyzeAbort) window.analyzeAbort.abort();
}

async function loadDbMeta() {
  const statusEl = document.getElementById('metaStatus');
  const metaBtn = document.getElementById('metaBtn');
  metaBtn.disabled = true;
  metaBtn.textContent = '加载中...';
  try {
    const token = await makeToken();
    const r = await fetch(`${API()}/api/v1/database-meta`, {
      headers: { 'Authorization': `Bearer ${token}` },
    });
    if (!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText}`);
    const j = await r.json();
    const meta = j.data || j;
    databaseMeta = meta;
    const n = (meta.available_metrics || []).length;
    const dims = (meta.available_dimensions || []).length;
    statusEl.textContent = `已加载：${n} 个指标，${dims} 个维度`;
    document.getElementById('sendBtn').disabled = false;
  } catch (e) {
    databaseMeta = null; // 加载失败不留旧值，防止批量/单次把已清理的旧元数据发给后端
    statusEl.textContent = `加载失败：${e.message}`;
  } finally {
    metaBtn.disabled = false;
    metaBtn.textContent = '重新加载';
  }
}

// 分析中：主按钮禁用，露出取消按钮
function setAnalyzeRunning(running) {
  const btn = document.getElementById('sendBtn');
  const cancel = document.getElementById('cancelBtn');
  btn.disabled = running;
  btn.textContent = running ? '分析中...' : '发起分析';
  cancel.classList.toggle('hidden', !running);
}

async function doAnalyze() {
  const query = document.getElementById('query').value.trim();
  if (!query) { showToast('请输入查询问题'); return; }
  if (!databaseMeta) { showToast('请先点击「加载元数据」'); return; }
  const out = document.getElementById('output');
  const timingEl = document.getElementById('timing');
  setAnalyzeRunning(true);
  modelGroups = {};
  tokenRows = {};
  protoEventArchive = []; // 新一次分析开始，重置执行进度存档
  out.innerHTML = PROGRESS_SKELETON;
  const t0 = performance.now();
  const timer = setInterval(() => { timingEl.textContent = `已耗时 ${((performance.now()-t0)/1000).toFixed(1)}s`; }, 100);

  // 按三选一决策 request_id：生产种子 / 本页生成 / 平台会话自造
  let requestId, isProd;
  try {
    ({ requestId, prod: isProd } = await resolveTestRequestId(query));
  } catch (e) {
    clearInterval(timer);
    out.innerHTML = '';
    setAnalyzeRunning(false);
    showToast(`获取 request_id 失败（${e.message}）`);
    return;
  }
  const body = { request_id: requestId, query, database_meta: databaseMeta };
  if (isProd) body.skip_chat_clear = true; // 生产/平台会话 id 禁止后端触发 chat/clear，防止清掉真实会话记录
  // 记录进行中的分析，页面刷新/切走后可恢复现场（结果缓存随后端内存缓冲区 TTL 10 分钟）
  try { localStorage.setItem(RECOVERY_KEY, JSON.stringify({ requestId, query, prod: isProd, startedAt: Date.now() })); } catch (e) {}

  const abort = new AbortController();
  window.analyzeAbort = abort; // 取消按钮触发点（SSE 收尾断开也会复用）

  try {
    const token = await makeToken();

    // 1) 先订阅 SSE 进度（fetch 方式，可携带 Authorization 头）；fresh=1 跳过旧事件重放
    const ssePromise = openProgressSse(token, requestId, abort.signal, true);

    // 2) 发起分析（后端执行时事件经内存总线流入 SSE）
    const r = await fetch(`${API()}/api/v1/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify(body),
    });

    if (!r.ok) {
      const errorText = await r.text();
      renderError(`请求失败：${r.status} ${r.statusText}<br>${esc(errorText).slice(0, 500)}`);
      setAnalyzeRunning(false);
      clearInterval(timer);
      abort.abort();
      try { localStorage.removeItem(RECOVERY_KEY); } catch (e) {}
      singleHistoryReport(query, 'err', performance.now() - t0, `HTTP ${r.status}`, '', { requestId });
      return;
    }

    const parsed = await r.json();
    clearInterval(timer);
    // POST 已返回，但 SSE 通道里可能还有收尾事件（done/close 等）。
    // 保留订阅：收到 close 事件立即断开；否则 1.5s 宽限后强制断开，避免挂死。
    window.analyzeAbort = abort;
    window.sseGraceTimer = setTimeout(() => abort.abort(), 1500);
    renderFinal(parsed);
    const secs = ((performance.now()-t0)/1000).toFixed(1);
    timingEl.textContent = `总耗时 ${secs}s`;
    setAnalyzeRunning(false);
    try { localStorage.removeItem(RECOVERY_KEY); } catch (e) {}
    singleHistoryReport(query, parsed.status === 'success' ? 'ok' : 'err', performance.now() - t0,
      parsed.status === 'success' ? '' : (parsed.answer || ''), parsed.log_path,
      { requestId, parsed });

  } catch (e) {
    renderError(`请求失败：${e.message}`);
    clearInterval(timer);
    abort.abort();
    setAnalyzeRunning(false);
    try { localStorage.removeItem(RECOVERY_KEY); } catch (e2) {}
    singleHistoryReport(query, 'err', performance.now() - t0, e.message, '', { requestId });
  }
}

// 消息路由：step_id 以 decompose-attempt- 开头的为模型原始输出消息（分析框），
// 其余为 Redis Stream 协议消息（执行进度框）。分组规则见 docs/v1.1.1/页面消息展示说明.md
let modelGroups, tokenRows;

function handleProgress(ev) {
  if (String(ev.step_id || '').startsWith('decompose-attempt-')) {
    handleModelEvent(ev);
  } else {
    handleProtocolEvent(ev);
  }
}

function tsOf(ev) {
  return new Date((ev.timestamp || Math.floor(Date.now()/1000)) * 1000).toTimeString().slice(0, 8);
}

// 页面打开自动加载元数据（data/database_meta.json），分析时用它拼提示词
(async function autoLoadMeta() {
  await loadDbMeta();
  // 若上次分析未完成即刷新/切走，自动恢复现场
  tryRecoverPendingAnalysis();
})();

function clearPlaceholder(area) {
  if (area.textContent === '等待事件...') area.textContent = '';
}

// 协议消息：执行进度框，格式见文档第 3 节
function handleProtocolEvent(ev) {
  const area = document.getElementById('progressArea');
  // 进度框不存在（异常场景）时仍存档，保证历史有回放数据
  protoEventArchive.push(ev);
  if (!area) return;
  clearPlaceholder(area);
  const t = tsOf(ev);
  const msg = String(ev.message ?? '');
  const sid = ev.step_id || '';
  const div = document.createElement('div');
  const et = ev.event_type;
  if (et === 'title') {
    // close 没有 step_id，title 即全局开始；think 重试提示也是 title
    div.style.color = '#1677ff';
    div.textContent = `${t} ▶ [${sid || 'close'}] ${msg.replace(/\n$/, '')}`;
  } else if (et === 'line') {
    div.style.color = '#555';
    div.textContent = `${t}   ${msg.replace(/\n$/, '')}`;
  } else if (et === 'token') {
    // analyze/summarize 正文：同一 step_id 流式追加在同一行
    let row = tokenRows[sid];
    if (!row) {
      row = document.createElement('div');
      row.style.color = '#722ed1';
      area.appendChild(row);
      tokenRows[sid] = row;
    }
    row.textContent += msg;
    area.scrollTop = area.scrollHeight;
    return;
  } else if (et === 'done') {
    div.style.color = '#52c41a';
    div.textContent = `${t} ✔ [${sid || 'close'}] ${sid ? '完成' : '请求结束'}`;
    if (!sid) {
      // close 事件：收尾完成，立即断开 SSE，不再等宽限期
      clearTimeout(window.sseGraceTimer);
      // 恢复模式（sseCloseAbortDisabled=true）：close 只代表事件流结束，由结果轮询收尾，不主动断开
      if (!window.sseCloseAbortDisabled && window.analyzeAbort) window.analyzeAbort.abort();
    }
  } else if (et === 'error') {
    div.style.color = '#ff4d4f';
    div.textContent = `${t} ✖ [${sid}] ${msg.replace(/\n$/, '')}`;
  } else {
    div.textContent = `${t} ${JSON.stringify(ev)}`;
  }
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

// 模型原始输出：分析框，按 attempt 分组，规则见文档第 4 节
function handleModelEvent(ev) {
  const area = document.getElementById('modelArea');
  if (!area) return;
  clearPlaceholder(area);
  const attempt = (String(ev.step_id).match(/^decompose-attempt-(\d+)$/) || [])[1] || '?';

  let group = modelGroups[attempt];
  if (ev.event_type === 'title') {
    if (group) {
      // 同 attempt 的后续 title 是重试提示（如「第 2 次尝试」+ 原因），追加显示不覆盖
      const note = document.createElement('div');
      note.style.cssText = 'font-size:11px;color:#fa8c16;margin-top:2px;';
      note.textContent = String(ev.message ?? '').replace(/\n$/, '');
      if (group.head) group.head.appendChild(note);
      return;
    }
    // 先收尾上一组（上一组成功结束，无结束消息），再注册新组
    finalizeModelGroups();
    group = { raw: '', error: '', finalized: false, box: null, body: null, head: null };
    modelGroups[attempt] = group;
    const box = document.createElement('div');
    box.style.cssText = 'border:1px solid #e8e8e8;border-left:3px solid #1677ff;border-radius:4px;padding:6px 10px;margin:6px 0;';
    const head = document.createElement('div');
    head.style.cssText = 'font-size:12px;color:#1677ff;margin-bottom:4px;';
    head.textContent = String(ev.message ?? '').replace(/\n$/, '') || `第 ${attempt} 次尝试`;
    const body = document.createElement('div');
    body.style.cssText = 'font-size:11px;white-space:pre-wrap;word-break:break-all;color:#333;';
    box.appendChild(head); box.appendChild(body);
    area.appendChild(box);
    group.box = box; group.body = body; group.head = head;
    area.scrollTop = area.scrollHeight;
    return;
  }
  if (!group) {
    group = { raw: '', error: '', finalized: false, box: null, body: null, head: null };
    modelGroups[attempt] = group;
  }
  if (ev.event_type === 'token') {
    group.raw += (ev.message ?? '');
    if (group.body && !group.finalized) group.body.textContent = group.raw;
    area.scrollTop = area.scrollHeight;
  } else if (ev.event_type === 'error') {
    group.error = String(ev.message ?? '').replace(/\n$/, '');
    if (group.box) group.box.style.borderLeftColor = '#ff4d4f';
    const err = document.createElement('div');
    err.style.cssText = 'font-size:12px;color:#ff4d4f;margin-top:4px;';
    err.textContent = `✖ ${group.error}`;
    if (group.box) group.box.appendChild(err);
    area.scrollTop = area.scrollHeight;
  }
}

// 把已结束的组的累积文本尝试 JSON 美化；失败组保持原文
function finalizeModelGroups() {
  for (const [attempt, g] of Object.entries(modelGroups)) {
    if (g.finalized || g.error) { g.finalized = true; continue; }
    g.finalized = true;
    if (!g.body || !g.raw.trim()) continue;
    let pretty = g.raw;
    try { pretty = JSON.stringify(JSON.parse(g.raw), null, 2); } catch (e) {}
    g.body.textContent = pretty;
  }
}

function renderError(msg) {
  finalizeModelGroups();
  const el = document.getElementById('finalArea');
  if (el) el.innerHTML = `<div style="color:#ff4d4f">${msg}</div>`;
}

function renderFinal(parsed) {
  finalizeModelGroups();
  const out = document.getElementById('output');
  const ok = parsed.status === 'success' || parsed.status === 'completed';

  // 进度卡片保留，只更新最终结果区域
  const el = document.getElementById('finalArea') || out;
  let html = ok
    ? `<div><span class="st-ok">✅</span><span style="font-size:12px;color:#666;margin-left:8px;">请求成功 · ${parsed.request_id || ''}</span></div>`
    : `<div style="color:#ff4d4f;">⚠ 状态：${esc(parsed.status || 'unknown')} · ${parsed.request_id || ''}</div>`;

    // recall 数据来源标识（后端 analyze 响应带回的缩圈信息）
    window._lastRecallMeta = (parsed.recall && parsed.recall.database_meta) || null;
    const rc = parsed.recall;
    if (rc) {
      const used = !!rc.used;
      const color = used ? '#52c41a' : (rc.enabled ? '#fa8c16' : '#999');
      const bg = used ? '#f6ffed' : (rc.enabled ? '#fff7e6' : '#f5f5f5');
      const border = used ? '#b7eb8f' : (rc.enabled ? '#ffd591' : '#d9d9d9');
      const label = used
        ? '✅ Recall 缩圈生效'
        : (rc.enabled ? `⚠ Recall 已启用但未生效（${esc(rc.message || '降级')}）` : 'Recall 未启用，使用全量元数据');
      const detail = used
        ? `来源 ${esc(rc.source || '-')} · 耗时 ${(rc.elapsed || 0).toFixed(2)}s · metrics=${rc.metrics} dims=${rc.dimensions} tables=${rc.tables}`
        : `来源 ${esc(rc.source || '-')}`;
      html += `<div style="margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <span style="display:inline-flex;align-items:center;gap:6px;background:${bg};border:1px solid ${border};color:${color};border-radius:4px;padding:4px 10px;font-size:12px;font-weight:600;">
            ${label}
          </span>
          <span style="font-size:12px;color:#888;">${detail}</span>
          ${used && window._lastRecallMeta ? `<button type="button" class="btn btn-default" style="padding:2px 10px;font-size:12px;" onclick="showRecallMeta()">查看缩圈元数据</button>` : ''}
        </div>`;
    }

    if (parsed.answer) {
      html += `<div class="answer"><b>回答：</b>${esc(String(parsed.answer))}</div>`;
    }

    const log = parsed.execution_log || [];
    if (log.length) {
      html += `<div class="steps"><b style="font-size:13px;">执行步骤 (${log.length})</b>`;
      log.forEach(s => {
        const st = (s.status === 'completed' || s.status === 'success') ? 'done' : (s.status === 'failed' ? 'failed' : '');
        html += `<div class="step ${st}">
          <b>${esc(s.step_id || '')}</b> <span style="color:#1677ff;">[${esc(s.type || s.step_type || '')}]</span> ${esc(s.status || '')}
          <div>${esc(s.description || s.desc || '')}</div>
          <div class="meta">${esc(s.error || '')}${s.elapsed !== undefined ? ` elapsed=${s.elapsed}s` : ''}</div>
        </div>`;
      });
      html += '</div>';
    }

    const data = parsed.data;
    if (Array.isArray(data) && data.length && typeof data[0] === 'object') {
      const cols = Object.keys(data[0]);
      html += `<b style="font-size:13px;">数据 (${data.length} 行)</b>
        <table class="data"><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>
        ${data.slice(0, 100).map(row => `<tr>${cols.map(c => `<td>${esc(String(row[c] ?? ''))}</td>`).join('')}</tr>`).join('')}
        </table>${data.length > 100 ? `<div style="font-size:12px;color:#999;">仅显示前 100 行</div>` : ''}`;
    }

    // 模型每次尝试的完整原始输出（含失败重试的多次，全部追加展示）
    const outputs = Array.isArray(parsed.model_outputs) ? parsed.model_outputs : [];
    if (outputs.length) {
      html += `<div style="margin-top:10px;"><b style="font-size:13px;">模型原始输出（${outputs.length} 次尝试）</b>`;
      outputs.forEach(o => {
        const failed = o.status === 'failed';
        const n = o.attempt ?? '?';
        html += `<details ${outputs.length === 1 ? 'open' : ''} style="margin-top:6px;">
          <summary style="cursor:pointer;font-size:12px;${failed ? 'color:#ff4d4f;' : 'color:#52c41a;'}">
            第 ${n} 次尝试 ${failed ? '❌ 失败' : '✅ 成功'}${failed && o.error ? ` · ${esc(o.error).slice(0, 120)}` : ''}
          </summary>
          <div class="result" style="margin-top:4px;max-height:none;overflow:visible;">${esc(o.raw_output || '(空)')}</div>
        </details>`;
      });
      html += '</div>';
    }

    el.innerHTML = html;
}

const AUTH = async () => ({ 'Authorization': 'Bearer ' + await makeToken(), 'Content-Type': 'application/json' });
const BATCH_USER = 'page-test';
let batchItems = [];       // { idx, q, status: pending|running|ok|err, ms, error, log_path }
let batchRunning = false;
let batchAbort = false;
let batchAbortCtrl = null;
let lastReport = null;
let liveReport = null;          // 实时增量报告：{ rows, total, correct, errors, pass_rate, error_type_stats }
let liveReportLoading = new Set(); // 正在判定的题号（防并发重复）

function batchToast(msg, color = '') {

}

function batchCollect() {
  const file = document.getElementById('batchFile').files[0];
  const text = document.getElementById('batchText').value;
  if (file) {
    return file.text().then(t => t.split(/\r?\n/).map(s => s.trim()).filter(Boolean));
  }
  return Promise.resolve(text.split(/\r?\n/).map(s => s.trim()).filter(Boolean));
}

function batchRender() {
  const box = document.getElementById('batchList');
  box.style.display = batchItems.length ? 'block' : 'none';
  const done = batchItems.filter(x => x.status === 'ok' || x.status === 'err').length;
  document.getElementById('batchBar').style.width = batchItems.length ? (done / batchItems.length * 100) + '%' : '0';
  document.getElementById('batchProgText').textContent = `${done}/${batchItems.length}`;
  updateBatchTabBadge();
  box.innerHTML = batchItems.map(it => {
    const icon = { pending: '⏳', running: '⚡', ok: '✅', err: '❌' }[it.status];
    const color = it.status === 'err' ? '#ff4d4f' : (it.status === 'ok' ? '#52c41a' : '#999');
    return `<div class="batch-item">
      <span style="color:${color};white-space:nowrap;">${icon} #${it.idx + 1}</span>
      <span class="batch-q" onclick="batchViewLog(${it.idx})" title="点击查看操作日志">${esc(it.q)}</span>
      <span style="color:${color};white-space:nowrap;">${it.ms ? (it.ms / 1000).toFixed(1) + 's' : ''}</span>
    </div>`;
  }).join('');
}

async function batchViewLog(idx) {
  const it = batchItems[idx];
  if (!it) return;
  const d = document.getElementById('batchReportDate').value.trim() ||
    new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' });
  const title = `操作日志 · #${idx + 1} ${esc(it.q)}`;
  openBatchModal(title, '加载中...');
  try {
    const auth = await AUTH();
    let path = it.log_path || `userlogs/${BATCH_USER}/${d}/问题${idx + 1}.log`;
    if (!it.log_path) {
      try {
        const lr = await fetch(BASE + '/api/v1/logs/list', {
          method: 'POST', headers: auth,
          body: JSON.stringify({ user_id: BATCH_USER, log_date_start: d, log_date_end: d, question: it.q, page: 1, page_size: 20 }),
        });
        const lj = await lr.json();
        const rows = (lj.data && lj.data.list) || [];
        const hit = rows.find(x => x.question === it.q);
        if (hit && hit.log_path) path = hit.log_path;
      } catch (e) { /* 查询失败则按默认路径尝试 */ }
    }
    const r = await fetch(BASE + '/api/v1/logs/preview', {
      method: 'POST', headers: auth, body: JSON.stringify({ log_path: path }),
    });
    const j = await r.json();
    const full = j.data && (j.data.full_text || j.data.content);
    openBatchModal(title, full ? full : `未找到日志（${esc(path)}）`);
  } catch (e) {
    openBatchModal(title, '加载失败: ' + e.message);
  }
}

function batchStop() { batchAbort = true; if (batchAbortCtrl) batchAbortCtrl.abort(); }

function batchClear() {
  if (batchRunning) { batchToast('批量执行中，请先停止', '#ff4d4f'); return; }
  batchItems = []; lastReport = null; liveReport = null; liveReportLoading.clear(); batchId = null;
  try { localStorage.removeItem('batchState_v1'); localStorage.removeItem('batchReport_v1'); localStorage.removeItem('batchId_v1'); } catch (e) {}
  document.getElementById('batchReportArea').innerHTML = '';
  batchRender();
}

async function batchStart() {
  if (batchRunning) { batchToast('已在批量执行中', '#fa8c16'); return; }
  const qs = await batchCollect();
  if (!qs.length) { batchToast('请先选择文件或输入问题', '#fa8c16'); return; }
  // 每批开始都重新拉取最新元数据，避免用页面残留旧数据（清理/重播种后内存不会自动失效）
  await loadDbMeta();
  if (!databaseMeta) { batchToast('元数据加载失败，批量已中止（否则模型将填 UNKNOWN 表名）', '#ff4d4f'); return; }
  // 与单次测试共用同一决策：生产种子 / 本页生成 / 平台会话自造
  // 平台会话模式用批次第一个问题创建会话（后端要求 question 非空）
  let requestId, isProd;
  try {
    ({ requestId, prod: isProd } = await resolveTestRequestId(qs[0]));
  } catch (e) {
    batchToast(`获取 request_id 失败（${e.message}），批量已中止`, '#ff4d4f');
    return;
  }
  let conc = Math.max(1, Math.min(5, parseInt(document.getElementById('batchConc').value || '1', 10)));
  if (isProd && conc > 1) {
    conc = 1; // 缓存里只有一个生产 id，多并发会共用同一会话互相踩，强制串行
    document.getElementById('batchConc').value = '1';
    batchToast('使用生产 request_id 时仅支持串行执行（并发已调为 1），问答历史会随批次累积', '#fa8c16');
  }
  batchItems = qs.map((q, i) => ({ idx: i, q, status: 'pending', ms: 0, error: '' }));
  batchAbort = false; batchRunning = true;
  batchAbortCtrl = new AbortController();
  // 新批次开始，清空上一批的报告展示与缓存（与「清空」按钮同源逻辑）
  lastReport = null; liveReport = null; liveReportLoading.clear();
  try { localStorage.removeItem('batchReport_v1'); } catch (e) {}
  document.getElementById('batchReportArea').innerHTML = '';
  const reportSt = document.getElementById('batchReportStatus');
  if (reportSt) { reportSt.textContent = ''; reportSt.style.color = ''; }
  saveBatchState();
  document.getElementById('batchStartBtn').disabled = true;
  document.getElementById('batchStopBtn').disabled = false;
  batchRender();
  batchHistorySync();
  let cursor = 0;
  const worker = async () => {
    while (!batchAbort) {
      const i = cursor++;
      if (i >= batchItems.length) return;
      const it = batchItems[i];
      it.status = 'running'; batchRender();
      const t0 = performance.now();
      try {
        const body = { request_id: requestId, query: it.q, user_id: BATCH_USER, return_details: false, database_meta: databaseMeta };
        if (isProd) body.skip_chat_clear = true;
        const r = await fetch(BASE + '/api/v1/analyze', {
          method: 'POST', headers: await AUTH(),
          body: JSON.stringify(body),
          signal: batchAbortCtrl.signal,
        });
        const j = await r.json();
        it.ms = Math.round(performance.now() - t0);
        if (typeof j.log_path === 'string' && j.log_path) it.log_path = j.log_path;
        if (r.ok && (j.status === 'success' || j.status === 'completed')) { it.status = 'ok'; }
        else { it.status = 'err'; it.error = j.message || j.error || ('HTTP ' + r.status); }
      } catch (e) {
        it.ms = Math.round(performance.now() - t0);
        it.status = 'err'; it.error = batchAbort && batchAbortCtrl.signal.aborted ? '已手动停止' : e.message;
      }
      batchRender(); saveBatchState(); batchHistorySync();
      if (it.status === 'ok' || it.status === 'err') liveAppendReport(it); // 实时增量判定（不阻塞下一题）
    }
  };
  await Promise.all(Array.from({ length: conc }, worker));
  batchRunning = false;
  document.getElementById('batchStartBtn').disabled = false;
  document.getElementById('batchStopBtn').disabled = true;
  const errN = batchItems.filter(x => x.status === 'err').length;
  saveBatchState();
  batchHistorySync();
  batchHistoryLoad();
  // 全部执行完毕：自动全量刷新一次报告（兜底纠正单题实时判定可能出现的遗漏/失败）
  if (!batchAbort && batchItems.some(x => x.status === 'ok' || x.status === 'err')) {
    await batchShowReport(true);
  }
  batchToast(batchAbort ? `已停止，完成 ${batchItems.length - errN}/${batchItems.length}` : `批量完成：${batchItems.length - errN}/${batchItems.length} 成功`,
    errN ? '#fa8c16' : '#52c41a');
}

// 本批已完成的题按显式题号(items)生成报告：log_path 缺失的题保留占位（后端标"日志缺失"），不错位不丢题
function batchLogItems() {
  return batchItems.filter(x => x.status === 'ok' || x.status === 'err')
    .map(x => ({ qnum: x.idx + 1, log_path: x.log_path || '', question: x.q }));
}

// 响应未带 log_path 时反查 DB 补路径（超时/丢包场景下日志已落盘但响应没等到）
async function batchResolveLogPath(it, d) {
  if (it.log_path) return it.log_path;
  try {
    const lr = await fetch(BASE + '/api/v1/logs/list', {
      method: 'POST', headers: await AUTH(),
      body: JSON.stringify({ user_id: BATCH_USER, log_date_start: d, log_date_end: d, question: it.q, page: 1, page_size: 20 }),
    });
    const lj = await lr.json();
    const rows = (lj.data && lj.data.list) || [];
    const hit = rows.find(x => x.question === it.q);
    return (hit && hit.log_path) || '';
  } catch (e) { return ''; }
}

// auto=true：全部跑完自动触发的全量刷新（不显示"生成中"；完成后显示最终统计）
async function batchShowReport(auto = false) {
  const st = document.getElementById('batchReportStatus');
  if (!auto) { st.textContent = '生成中...'; st.style.color = '#1677ff'; }
  const d = document.getElementById('batchReportDate').value.trim() ||
    new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' });
  const done = batchItems.filter(x => x.status === 'ok' || x.status === 'err');
  for (const it of done) {
    if (!it.log_path) it.log_path = await batchResolveLogPath(it, d);
  }
  const items = done.map(x => ({ qnum: x.idx + 1, log_path: x.log_path || '', question: x.q }));
  const body = { items, user_id: BATCH_USER, log_date: d };
  try {
    const r = await fetch(BASE + '/api/v1/batch/report', { method: 'POST', headers: await AUTH(), body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok || !j.data) { throw new Error(j.message || ('HTTP ' + r.status)); }
    lastReport = j.data;
    liveReport = { ...j.data, rows: (j.data.rows || []).slice() }; // 全量刷新同步实时报告，后续增量在其上追加
    try { localStorage.setItem('batchReport_v1', JSON.stringify({ user_id: BATCH_USER, log_date: d, report: j.data })); } catch (e) {}
    renderBatchReport(j.data);
    st.textContent = `完成 · ${j.data.total} 题 · 通过率 ${j.data.pass_rate}%`;
    st.style.color = '#52c41a';
  } catch (e) {
    if (auto && liveReport && liveReport.total) {
      st.textContent = `实时已判 ${liveReport.total} 题 · 全量刷新失败，请手动重试: ${e.message}`;
    } else {
      st.textContent = (auto ? '自动汇总失败: ' : '失败: ') + e.message;
    }
    st.style.color = '#ff4d4f';
  }
}

// 单题实时判定：完成后把该题报告行插入 liveReport 并重渲染（qnum 去重、按题号排序）
async function liveAppendReport(it) {
  const qnum = it.idx + 1;
  if (liveReportLoading.has(qnum)) return;
  liveReportLoading.add(qnum);
  try {
    const d = document.getElementById('batchReportDate').value.trim() ||
      new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' });
    const log_path = it.log_path || await batchResolveLogPath(it, d);
    const r = await fetch(BASE + '/api/v1/batch/report', {
      method: 'POST', headers: await AUTH(),
      body: JSON.stringify({ items: [{ qnum, log_path: log_path || '', question: it.q }], user_id: BATCH_USER, log_date: d }),
    });
    const j = await r.json();
    if (!r.ok || !j.data || !(j.data.rows || []).length) throw new Error(j.message || ('HTTP ' + r.status));
    const row = j.data.rows[0];
    if (!liveReport) liveReport = { rows: [] };
    const rows = liveReport.rows;
    const i = rows.findIndex(x => x.num === qnum);
    if (i >= 0) rows[i] = row; else rows.push(row);
    rows.sort((a, b) => a.num - b.num);
    const correct = rows.filter(x => x.correct === '正确').length;
    liveReport.total = rows.length;
    liveReport.correct = correct;
    liveReport.errors = rows.length - correct;
    liveReport.pass_rate = rows.length ? Math.round(correct / rows.length * 100) : 0;
    liveReport.error_type_stats = countErrorStats(rows);
    renderBatchReport(liveReport);
    updateLiveStatus();
  } catch (e) {
    console.warn('liveAppendReport failed #' + qnum, e);
    updateLiveStatus();
  } finally {
    liveReportLoading.delete(qnum);
  }
}

function countErrorStats(rows) {
  const m = {};
  rows.forEach(r => { const t = r.error_type || '未知'; m[t] = (m[t] || 0) + 1; });
  return Object.keys(m).map(type => ({ type, count: m[type] }));
}

function updateLiveStatus() {
  const st = document.getElementById('batchReportStatus');
  if (!st || !batchRunning) return;
  const done = batchItems.filter(x => x.status === 'ok' || x.status === 'err').length;
  const n = liveReport ? liveReport.rows.length : 0;
  const rate = liveReport && liveReport.total ? liveReport.pass_rate : 0;
  st.textContent = `实时判定 ${n}/${done} · 通过率 ${rate}%`;
  st.style.color = n < done ? '#1677ff' : '#52c41a';
}

function stepOutputsHtml(list) {
  const so = Array.isArray(list) ? list : [];
  if (!so.length) return '';
  return `<div style="font-size:12px;font-weight:600;margin:10px 0 4px;color:#1a1a1a;">步骤模型输出 · 执行计划 JSON（${so.length} 步）</div>` +
    so.map(s => `
    <details style="margin-bottom:6px;">
      <summary style="cursor:pointer;font-size:12px;color:#1677ff;">${esc(s.step_id || '')} · ${esc(s.type || '')} · ${esc(s.description || '-')}</summary>
      <pre style="white-space:pre-wrap;word-break:break-all;font-size:11px;font-family:Consolas,monospace;background:#f6f6f6;border:1px solid #e8e8e8;border-radius:4px;padding:8px;margin:4px 0 0;">${esc(s.plan_json || '（无执行计划 JSON）')}</pre>
    </details>`).join('');
}

function renderBatchReport(rep) {
  const area = document.getElementById('batchReportArea');
  if (!area) return;
  let html = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
    <div class="card" style="margin:0;flex:1;min-width:120px;text-align:center;"><div style="font-size:20px;font-weight:600;">${rep.total}</div><div style="font-size:12px;color:#999;">总题数</div></div>
    <div class="card" style="margin:0;flex:1;min-width:120px;text-align:center;"><div style="font-size:20px;font-weight:600;color:#52c41a;">${rep.correct}</div><div style="font-size:12px;color:#999;">通过</div></div>
    <div class="card" style="margin:0;flex:1;min-width:120px;text-align:center;"><div style="font-size:20px;font-weight:600;color:#ff4d4f;">${rep.errors}</div><div style="font-size:12px;color:#999;">未通过</div></div>
    <div class="card" style="margin:0;flex:1;min-width:120px;text-align:center;"><div style="font-size:20px;font-weight:600;color:#1677ff;">${rep.pass_rate}%</div><div style="font-size:12px;color:#999;">通过率</div></div>
  </div>`;
  if (rep.error_type_stats && rep.error_type_stats.length) {
    html += `<div style="font-size:12px;color:#666;margin-bottom:8px;">错误分布：` +
      rep.error_type_stats.map(s => `${esc(s.type)} × ${s.count}`).join('、') + '</div>';
  }
  html += `<table class="data"><tr><th>#</th><th>用户问题</th><th>结果</th><th>错误类型</th><th>步骤</th><th>answer</th></tr>`;
  rep.rows.forEach((r, i) => {
    const ok = r.correct === '正确';
    const bg = ok ? '' : 'background:#fff1f0;';
    html += `<tr style="${bg};cursor:pointer;" onclick="batchToggleDetail('batchDetail${i}')">
      <td>${r.num}</td>
      <td style="max-width:240px;word-break:break-all;">${esc(r.user_q)}</td>
      <td>${ok ? '<span style="color:#52c41a;">✅ 通过</span>' : '<span style="color:#ff4d4f;">❌ 未通过</span>'}</td>
      <td style="max-width:140px;">${esc(r.error_type)}</td>
      <td style="max-width:220px;font-size:11px;">${esc(r.steps || '-')}</td>
      <td style="max-width:320px;word-break:break-all;font-size:11px;">${esc((r.answer || '').slice(0, 160))}</td>
    </tr>
    <tr class="batch-detail" id="batchDetail${i}" style="display:none;">
      <td colspan="6" style="background:#fafafa;padding:10px;">
        <div style="font-size:12px;font-weight:600;margin-bottom:4px;color:#1a1a1a;">判定详情</div>
        <pre style="white-space:pre-wrap;word-break:break-all;font-size:11px;font-family:Consolas,monospace;margin:0 0 8px;">${esc(r.error_detail || '')}</pre>
        <div style="font-size:12px;font-weight:600;margin-bottom:4px;color:#1a1a1a;">数据验证</div>
        <pre style="white-space:pre-wrap;word-break:break-all;font-size:11px;font-family:Consolas,monospace;margin:0 0 8px;">${esc(r.verify || '-')}</pre>
        <div style="font-size:12px;font-weight:600;margin-bottom:4px;color:#1a1a1a;">完整回答</div>
        <div style="font-size:12px;word-break:break-all;">${esc(r.answer || '-')}</div>
        ${stepOutputsHtml(r.step_outputs)}
      </td>
    </tr>`;
  });
  html += '</table>';
  area.innerHTML = html;
}

function batchToggleDetail(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? '' : 'none';
}

async function batchDownloadExcel() {
  const d = document.getElementById('batchReportDate').value.trim() ||
    new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' });
  const done = batchItems.filter(x => x.status === 'ok' || x.status === 'err');
  for (const it of done) {
    if (!it.log_path) it.log_path = await batchResolveLogPath(it, d);
  }
  const items = done.map(x => ({ qnum: x.idx + 1, log_path: x.log_path || '', question: x.q }));
  const body = { items, user_id: BATCH_USER, log_date: d };
  try {
    const r = await fetch(BASE + '/api/v1/batch/report/excel', {
      method: 'POST',
      headers: await AUTH(),
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      let msg = 'HTTP ' + r.status;
      try { msg = (await r.json()).message || msg; } catch (e) {}
      throw new Error(msg);
    }
    const blob = await r.blob();
    const cd = r.headers.get('Content-Disposition') || '';
    let fn = `batch_report_${BATCH_USER}_${d}.xlsx`;
    const m = cd.match(/filename\*=UTF-8''([^;]+)/);
    if (m) fn = decodeURIComponent(m[1]);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = fn; a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { batchToast('下载失败: ' + e.message, '#ff4d4f'); }
}
// ==================== 批次历史 ====================
let batchId = null;

function batchHistorySync() {
  if (!batchItems.length) return;
  (async () => {
    try {
      const r = await fetch(BASE + '/api/v1/batch/history', {
        method: 'POST', headers: await AUTH(),
        body: JSON.stringify({
          batch_id: batchId || undefined,
          user_id: BATCH_USER,
          duration_ms: Math.round(batchItems.reduce((s, x) => s + (x.ms || 0), 0)),
          items: batchItems.map(x => ({ q: x.q, status: x.status, ms: x.ms, error: x.error, log_path: x.log_path || '' })),
        }),
      });
      const j = await r.json();
      if (r.ok && j.data && j.data.batch_id) {
        batchId = j.data.batch_id;
        try { localStorage.setItem('batchId_v1', batchId); } catch (e) {}
      }
    } catch (e) {}
  })();
}

let batchHistoryPage = 1;

async function batchHistoryLoad() {
  const area = document.getElementById('batchHistoryArea');
  if (!area) return;
  try {
    const r = await fetch(`${BASE}/api/v1/batch/history?user_id=${encodeURIComponent(BATCH_USER)}&page=${batchHistoryPage}&page_size=5`, { headers: await AUTH() });
    const j = await r.json();
    if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status));
    const records = j.data.list || [];
    const total = j.data.total || 0;
    const page = j.data.page || 1;
    const pages = Math.max(1, Math.ceil(total / (j.data.page_size || 5)));
    batchHistoryPage = page;
    const cnt = document.getElementById('batchHistCount');
    if (cnt) cnt.textContent = total ? `共 ${total} 批` : '';
    if (!records.length) { area.innerHTML = '<div style="font-size:12px;color:#999;padding:8px 10px;">暂无批次记录</div>'; return; }
    let html = '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
    records.forEach(rec => {
      const t = (rec.created_at || '').slice(5, 16);
      html += `<tr id="batchHistRow${rec.batch_id}" style="cursor:pointer;border-bottom:1px solid #f5f5f5;" onclick="batchHistoryExpand('${rec.batch_id}')">
        <td style="padding:6px 10px;white-space:nowrap;color:#666;">${esc(t)}</td>
        <td style="padding:6px 6px;">${rec.question_count} 题</td>
        <td style="padding:6px 6px;color:#52c41a;">${rec.ok_count} 成功</td>
        <td style="padding:6px 6px;color:${rec.err_count ? '#ff4d4f' : '#999'};">${rec.err_count} 失败</td>
        <td style="padding:6px 6px;color:#999;">${rec.duration_ms ? (rec.duration_ms / 1000).toFixed(0) + 's' : '-'}</td>
        <td style="padding:6px 10px;text-align:right;white-space:nowrap;">
          <button class="btn btn-default" style="padding:1px 8px;font-size:11px;margin-right:4px;" onclick="event.stopPropagation();batchHistoryExcel('${rec.batch_id}')">Excel</button>
          <button class="btn btn-default" style="padding:1px 8px;font-size:11px;color:#ff4d4f;border-color:#ff4d4f;" onclick="event.stopPropagation();batchHistoryDeleteConfirm('${rec.batch_id}')">删除</button>
        </td>
      </tr>`;
    });
    html += '</table>';
    if (pages > 1) {
      html += `<div style="margin-top:6px;padding:0 10px 6px;font-size:12px;color:#666;">共 ${total} 批
        <button class="btn btn-default" style="padding:1px 8px;" ${page <= 1 ? 'disabled' : ''} onclick="batchHistoryPage--;batchHistoryLoad()">‹</button>
        ${page}/${pages}
        <button class="btn btn-default" style="padding:1px 8px;" ${page >= pages ? 'disabled' : ''} onclick="batchHistoryPage++;batchHistoryLoad()">›</button></div>`;
    }
    area.innerHTML = html;
  } catch (e) { area.innerHTML = `<div style="font-size:12px;color:#ff4d4f;padding:8px 10px;">加载失败: ${esc(e.message)}</div>`; }
}

// 点击历史批次：把该批次的报告渲染到正常报告区（与刚测完一致），状态栏提示来源
async function batchHistoryExpand(batch_id) {
  const st = document.getElementById('batchReportStatus');
  if (st) { st.textContent = '报告生成中...'; st.style.color = '#1677ff'; }
  try {
    const r = await fetch(`${BASE}/api/v1/batch/history/${encodeURIComponent(batch_id)}`, { headers: await AUTH() });
    const j = await r.json();
    if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status));
    const rec = j.data;
    const paths = (rec.items || []).map(x => x.log_path).filter(Boolean);
    const body = paths.length ? { log_paths: paths, user_id: BATCH_USER, log_date: rec.log_date || '' }
      : { user_id: BATCH_USER, log_date: rec.log_date || '' };
    const rr = await fetch(BASE + '/api/v1/batch/report', { method: 'POST', headers: await AUTH(), body: JSON.stringify(body) });
    const jj = await rr.json();
    if (!rr.ok || !jj.data) throw new Error(jj.message || ('HTTP ' + rr.status));
    lastReport = jj.data;
    renderBatchReport(jj.data);
    if (st) { st.textContent = `历史批次 ${batch_id.slice(0, 8)} · ${jj.data.total} 题 · 通过率 ${jj.data.pass_rate}%`; st.style.color = '#fa8c16'; }
  } catch (e) {
    if (st) { st.textContent = '报告生成失败: ' + e.message; st.style.color = '#ff4d4f'; }
  }
}

async function batchHistoryExcel(batch_id) {
  try {
    const r = await fetch(`${BASE}/api/v1/batch/history/${encodeURIComponent(batch_id)}`, { headers: await AUTH() });
    const j = await r.json();
    if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status));
    const rec = j.data;
    const paths = (rec.items || []).map(x => x.log_path).filter(Boolean);
    const body = paths.length ? { log_paths: paths, user_id: BATCH_USER, log_date: rec.log_date || '' }
      : { user_id: BATCH_USER, log_date: rec.log_date || '' };
    const rr = await fetch(BASE + '/api/v1/batch/report/excel', { method: 'POST', headers: await AUTH(), body: JSON.stringify(body) });
    if (!rr.ok) { let msg = 'HTTP ' + rr.status; try { msg = (await rr.json()).message || msg; } catch (e) {} throw new Error(msg); }
    const blob = await rr.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `batch_report_${batch_id}.xlsx`; a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { batchToast('下载失败: ' + e.message, '#ff4d4f'); }
}

let batchDeleteTarget = null;

function batchHistoryDeleteConfirm(batch_id) {
  batchDeleteTarget = batch_id;
  const modal = document.getElementById('batchLogModal');
  modal.innerHTML = `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;display:flex;align-items:center;justify-content:center;" onclick="if(event.target===this)batchHistoryDeleteCancel()">
    <div style="background:#fff;border-radius:8px;padding:20px;width:400px;max-width:92vw;">
      <div style="font-size:14px;font-weight:600;margin-bottom:10px;">删除批次</div>
      <div style="font-size:12px;color:#666;margin-bottom:12px;word-break:break-all;">确认删除批次 ${esc(batch_id)}？</div>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#333;margin-bottom:16px;cursor:pointer;">
        <input type="checkbox" id="batchDelLogs"> 同时删除日志文件和数据库日志记录
      </label>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-default" onclick="batchHistoryDeleteCancel()">取消</button>
        <button class="btn btn-primary" style="background:#ff4d4f;" onclick="batchHistoryDeleteDo()">确认删除</button>
      </div>
    </div>
  </div>`;
}

function batchHistoryDeleteCancel() {
  batchDeleteTarget = null;
  document.getElementById('batchLogModal').innerHTML = '';
}

async function batchHistoryDeleteDo() {
  const withLogs = document.getElementById('batchDelLogs').checked;
  const id = batchDeleteTarget;
  batchHistoryDeleteCancel();
  try {
    const r = await fetch(`${BASE}/api/v1/batch/history/${encodeURIComponent(id)}?with_logs=${withLogs}`, { method: 'DELETE', headers: await AUTH() });
    const j = await r.json();
    if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status));
    batchToast(withLogs ? '已删除批次及日志' : '已删除批次记录', '#52c41a');
    batchHistoryLoad();
  } catch (e) { batchToast('删除失败: ' + e.message, '#ff4d4f'); }
}

function saveBatchState() {
  try { localStorage.setItem('batchState_v1', JSON.stringify({ user_id: BATCH_USER, items: batchItems })); } catch (e) {}
}

function restoreBatchState() {
  try {
    const raw = localStorage.getItem('batchState_v1');
    if (!raw) return;
    const st = JSON.parse(raw);
    if (st.user_id !== BATCH_USER || !Array.isArray(st.items) || !st.items.length) return;
    batchItems = st.items.map(x => ({ ...x, status: x.status === 'running' ? 'err' : x.status, error: x.status === 'running' ? '执行被中断（页面刷新）' : (x.error || '') }));
    batchRender();
    const rawRep = localStorage.getItem('batchReport_v1');
    if (rawRep) {
      const rp = JSON.parse(rawRep);
      document.getElementById('batchReportDate').value = rp.log_date || '';
      lastReport = rp.report;
      renderBatchReport(rp.report);
      const stEl = document.getElementById('batchReportStatus');
      stEl.textContent = `已恢复 · ${rp.report.total} 题 · 通过率 ${rp.report.pass_rate}%`;
      stEl.style.color = '#fa8c16';
    }
    batchToast('已恢复上次批量结果', '#fa8c16');
  } catch (e) { console.warn('restoreBatchState failed', e); }
}
restoreBatchState();
try { batchId = localStorage.getItem('batchId_v1') || null; } catch (e) {}
batchHistoryLoad();

// ==================== 批量测试结束 ====================

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

checkHealth();
loadDbMeta();
singleHistoryLoad();

if (idSource() === 'prod') refreshProdIdStatus();
